<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      :root {
        --ns-primary: #4f46e5;
        --ns-primary-hover: #4338ca;
        --ns-bg: #f8fafc;
        --ns-surface: #ffffff;
        --ns-border: #e2e8f0;
        --ns-text: #0f172a;
        --ns-text-muted: #64748b;
        --ns-accent: #eef2ff;
        --ns-radius: 10px;
        --ns-shadow:
          0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.06);
        --ns-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --ns-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
        --ns-graph-link: #cbd5e1;
        --ns-graph-label: #334155;
      }
      :root[data-theme="dark"] {
        --ns-primary: #818cf8;
        --ns-primary-hover: #a5b4fc;
        --ns-bg: #0f172a;
        --ns-surface: #1e293b;
        --ns-border: #334155;
        --ns-text: #e2e8f0;
        --ns-text-muted: #94a3b8;
        --ns-accent: #1e2a4a;
        --ns-shadow:
          0 1px 2px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.3);
        --ns-graph-link: #475569;
        --ns-graph-label: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: var(--ns-font);
        color: var(--ns-text);
        background: var(--ns-bg);
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }
      .app {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
      }
      .sidebar {
        background: var(--ns-surface);
        border-right: 1px solid var(--ns-border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .brand {
        padding: 18px 20px;
        border-bottom: 1px solid var(--ns-border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-logo {
        width: 28px;
        height: 28px;
        background: var(--ns-primary);
        border-radius: 7px;
        display: grid;
        place-items: center;
        color: white;
        font-weight: 700;
        font-size: 14px;
      }
      .brand-name {
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .theme-toggle {
        margin-left: auto;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        background: transparent;
        border: 1px solid var(--ns-border);
        border-radius: 6px;
        color: var(--ns-text-muted);
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        padding: 0;
      }
      .theme-toggle:hover {
        color: var(--ns-text);
        border-color: #cbd5e1;
      }
      .search-box {
        padding: 14px 16px;
        border-bottom: 1px solid var(--ns-border);
      }
      .search-input-wrap {
        position: relative;
      }
      .search-input {
        width: 100%;
        padding: 9px 12px 9px 34px;
        border: 1px solid var(--ns-border);
        border-radius: 8px;
        background: var(--ns-bg);
        font-size: 13px;
        font-family: var(--ns-font);
        color: var(--ns-text);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .search-input:focus {
        border-color: var(--ns-primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        background: var(--ns-surface);
      }
      .search-icon {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--ns-text-muted);
        pointer-events: none;
      }
      .filter-tab {
        flex: 1;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 500;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--ns-text-muted);
        cursor: pointer;
        text-align: center;
        transition: all 0.15s;
      }
      .filter-tab:hover {
        color: var(--ns-text);
      }
      .filter-tab.active {
        background: var(--ns-accent);
        color: var(--ns-primary);
        border-color: rgba(79, 70, 229, 0.2);
      }
      .autocomplete-list {
        display: none;
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        background: var(--ns-surface);
        border: 1px solid var(--ns-border);
        border-radius: 8px;
        box-shadow: var(--ns-shadow);
        max-height: 220px;
        overflow-y: auto;
        z-index: 20;
      }
      .autocomplete-item {
        padding: 7px 12px;
        font-size: 13px;
        font-family: var(--ns-mono);
        cursor: pointer;
        color: var(--ns-text);
      }
      .autocomplete-item.active {
        background: var(--ns-accent);
        color: var(--ns-primary);
      }

      .main {
        overflow-y: auto;
        background: var(--ns-bg);
      }
      .content {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 40px;
      }
      .content.graph-mode {
        max-width: none;
        margin: 0;
        padding: 0;
        height: 100%;
      }
      .graph-svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .graph-svg text {
        font-family: var(--ns-font);
      }
      .graph-split {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .graph-pane {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
      }
      .graph-preview-pane {
        flex: 0 0 42%;
        overflow-y: auto;
        border-top: 1px solid var(--ns-border);
        background: var(--ns-surface);
        padding: 20px 28px;
      }
      .graph-resizer {
        height: 6px;
        flex-shrink: 0;
        cursor: row-resize;
        background: var(--ns-border);
      }
      .graph-resizer:hover,
      .graph-resizer.dragging {
        background: var(--ns-primary);
      }
      .graph-preview-pane .note-title {
        font-size: 20px;
      }
      .graph-preview-pane .body {
        font-size: 14px;
      }
      .page-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .page-title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .page-meta {
        font-size: 12px;
        color: var(--ns-text-muted);
      }
      .empty {
        text-align: center;
        padding: 80px 20px;
        color: var(--ns-text-muted);
      }
      .empty-icon {
        font-size: 38px;
        margin-bottom: 12px;
        opacity: 0.5;
      }
      .empty-title {
        font-size: 15px;
        font-weight: 500;
        color: var(--ns-text);
        margin-bottom: 4px;
      }
      .empty-hint {
        font-size: 13px;
      }

      .card {
        background: var(--ns-surface);
        border: 1px solid var(--ns-border);
        border-radius: var(--ns-radius);
        padding: 14px 18px;
        margin-bottom: 10px;
        box-shadow: var(--ns-shadow);
        cursor: pointer;
        transition:
          transform 0.1s,
          box-shadow 0.15s,
          border-color 0.15s;
      }
      .card:hover {
        transform: translateY(-1px);
        border-color: #cbd5e1;
        box-shadow:
          0 2px 4px rgba(15, 23, 42, 0.06),
          0 8px 20px rgba(15, 23, 42, 0.08);
      }
      .card-title {
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 4px;
      }
      .card-date {
        font-size: 11px;
        color: var(--ns-text-muted);
        margin-bottom: 6px;
      }
      .card-snippet {
        font-size: 13px;
        color: var(--ns-text-muted);
        line-height: 1.5;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        white-space: pre-line;
        text-align: left;
      }
      .card-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        font-size: 11px;
        color: var(--ns-text-muted);
        font-family: var(--ns-mono);
      }
      .card-meta .chip {
        background: var(--ns-accent);
        color: var(--ns-primary);
        padding: 1px 7px;
        border-radius: 4px;
        font-weight: 500;
      }
      .card-meta .chip.clickable {
        cursor: pointer;
      }
      .card-meta .chip.clickable:hover {
        background: var(--ns-primary);
        color: white;
      }
      .card-expand {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--ns-border);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .card-expand-item {
        font-size: 12px;
        font-family: var(--ns-mono);
        color: var(--ns-text-muted);
        cursor: pointer;
        padding: 2px 0;
      }
      .card-expand-item:hover {
        color: var(--ns-primary);
      }
      .card-expand-empty {
        font-size: 12px;
        color: var(--ns-text-muted);
        font-style: italic;
      }
      .card-meta .chip.todo-prio {
        background: #fef3c7;
        color: #92400e;
      }
      .card-meta .chip.todo-due {
        background: #fee2e2;
        color: #991b1b;
      }
      :root[data-theme="dark"] .card-meta .chip.todo-prio {
        background: #451a03;
        color: #fcd34d;
      }
      :root[data-theme="dark"] .card-meta .chip.todo-due {
        background: #450a0a;
        color: #fca5a5;
      }

      .note-header {
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--ns-border);
      }
      .note-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
      }
      .note-filename {
        font-family: var(--ns-mono);
        font-size: 12px;
        color: var(--ns-text-muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .chip {
        font-size: 11px;
        background: var(--ns-accent);
        color: var(--ns-primary);
        padding: 3px 9px;
        border-radius: 4px;
        font-weight: 500;
      }
      .body {
        background: var(--ns-surface);
        border: 1px solid var(--ns-border);
        border-radius: var(--ns-radius);
        padding: 28px 36px;
        box-shadow: var(--ns-shadow);
        line-height: 1.65;
        font-size: 15px;
      }
      .body h1,
      .body h2,
      .body h3 {
        margin-top: 1.4em;
      }
      .body h1 {
        font-size: 1.6em;
      }
      .body h2 {
        font-size: 1.3em;
        border-bottom: 1px solid var(--ns-border);
        padding-bottom: 0.3em;
      }
      .body h3 {
        font-size: 1.1em;
      }
      .body code {
        background: var(--ns-bg);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: var(--ns-mono);
        font-size: 0.9em;
      }
      .body pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 14px 18px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .body pre code {
        background: none;
        color: inherit;
        padding: 0;
      }
      .body a {
        color: var(--ns-primary);
      }
      .body blockquote {
        border-left: 3px solid var(--ns-primary);
        padding-left: 14px;
        color: var(--ns-text-muted);
        margin: 1em 0;
      }
      .body ul.contains-task-list {
        list-style: none;
        padding-left: 0;
      }
      .body .task-list-item {
        padding-left: 0;
      }
      .body .task-list-item input[type="checkbox"] {
        margin-right: 8px;
      }

      .section-title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ns-text-muted);
        margin: 28px 0 10px;
      }
      .backlink-card {
        display: block;
        background: var(--ns-surface);
        border: 1px solid var(--ns-border);
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 6px;
        font-size: 13px;
        cursor: pointer;
        font-family: var(--ns-mono);
        color: var(--ns-text);
      }
      .backlink-card:hover {
        border-color: var(--ns-primary);
        color: var(--ns-primary);
      }

      .status-line {
        padding: 6px 12px;
        font-size: 12px;
        color: var(--ns-text-muted);
        background: var(--ns-surface);
        border-bottom: 1px solid var(--ns-border);
        font-family: var(--ns-mono);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status-line .spinner {
        width: 10px;
        height: 10px;
        border: 2px solid var(--ns-border);
        border-top-color: var(--ns-primary);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .card:focus-visible,
      .backlink-card:focus-visible,
      .filter-tab:focus-visible,
      .theme-toggle:focus-visible {
        outline: 2px solid var(--ns-primary);
        outline-offset: 2px;
      }

      @media (max-width: 720px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .content {
          padding: 20px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo">N</div>
          <div class="brand-name">Note Search</div>
          <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
          ></button>
        </div>
        <div class="search-box">
          <div class="search-input-wrap">
            <svg
              class="search-icon"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              id="search"
              class="search-input"
              type="text"
              placeholder="Search notes, todos, tags…"
              spellcheck="false"
              autocomplete="off"
            />
            <div id="autocomplete-list" class="autocomplete-list"></div>
          </div>
          <button
            id="graph-toggle"
            class="filter-tab"
            style="width: 100%; margin-top: 8px"
          >
            🕸 Graph View
          </button>
        </div>
      </aside>

      <main class="main">
        <div id="status" class="status-line" style="display: none">
          <div class="spinner"></div>
          <span id="status-text">Searching…</span>
        </div>
        <div class="content" id="content"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script>
      // ---------- Safe DOM helpers (no innerHTML on user data) ----------
      function el(tag, props, ...children) {
        const node = document.createElement(tag);
        if (props) {
          for (const [k, v] of Object.entries(props)) {
            if (v == null) continue;
            if (k === "class") node.className = v;
            else if (k === "text") node.textContent = v;
            else if (k === "dataset")
              for (const [dk, dv] of Object.entries(v)) node.dataset[dk] = dv;
            else if (k.startsWith("on") && typeof v === "function")
              node.addEventListener(k.slice(2).toLowerCase(), v);
            else if (typeof v === "string") node.setAttribute(k, v);
          }
        }
        for (const c of children.flat()) {
          if (c == null) continue;
          node.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
        }
        return node;
      }
      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
        return node;
      }
      function safeHTML(html) {
        // DOMPurify scrubs <script>, event handlers, javascript: URLs, etc.
        if (typeof DOMPurify !== "undefined") return DOMPurify.sanitize(html);
        return ""; // refuse to inject un-sanitized markdown if DOMPurify is missing
      }

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));

      // ---------- Theme ----------
      // Independent of the OS/browser theme: an explicit choice in
      // localStorage always wins; only falls back to prefers-color-scheme
      // when the user has never toggled it here.
      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        const btn = $("#theme-toggle");
        if (btn) btn.textContent = theme === "dark" ? "☀" : "☾";
      }
      function initTheme() {
        const saved = localStorage.getItem("ns-theme");
        const theme =
          saved ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        applyTheme(theme);
      }
      $("#theme-toggle").addEventListener("click", () => {
        const next =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        localStorage.setItem("ns-theme", next);
        applyTheme(next);
      });
      initTheme();

      // Wraps a click handler so Enter/Space also activate it - lets
      // clickable divs (cards, nav items, backlinks) behave like buttons
      // for keyboard users, without changing their visual/DOM role.
      function keyActivate(handler) {
        return (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            handler(e);
          }
        };
      }
      let debounceTimer = null;

      function setStatus(text, show) {
        const s = $("#status");
        $("#status-text").textContent = text;
        s.style.display = show ? "flex" : "none";
      }

      // ---------- Autocomplete data ----------
      // Tags/links/attribute-names are fetched once and cached; per-attribute
      // values are fetched lazily (there's no bounded list of attribute keys
      // to prefetch values for) and cached per key once seen.
      let tagListCache = [];
      let linkListCache = [];
      let attributeNameCache = [];
      const attributeValueCache = {};
      async function loadAutocompleteData() {
        try {
          const [tagsResp, linksResp, attrsResp] = await Promise.all([
            fetch("/api/tags").then((r) => r.json()),
            fetch("/api/links").then((r) => r.json()),
            fetch("/api/attributes").then((r) => r.json()),
          ]);
          tagListCache = tagsResp.values || [];
          linkListCache = linksResp.values || [];
          attributeNameCache = attrsResp.values || [];
        } catch (e) {
          console.error("loadAutocompleteData failed:", e);
        }
      }
      async function fetchAttributeValues(key) {
        if (attributeValueCache[key]) return attributeValueCache[key];
        try {
          const resp = await fetch(
            `/api/attribute-values?key=${encodeURIComponent(key)}`,
          ).then((r) => r.json());
          attributeValueCache[key] = resp.values || [];
        } catch (e) {
          attributeValueCache[key] = [];
        }
        return attributeValueCache[key];
      }

      // ---------- Autocomplete UI ----------
      // Four completion contexts, matching the query DSL (query_parser.rs):
      //   @word          -> link       (sugar for [[word]] - but only works
      //                                 for single-word names, since the `@`
      //                                 token stops at whitespace; multi-word
      //                                 link names need [[ ]] instead, so
      //                                 accepting a link suggestion always
      //                                 inserts the [[ ]] form regardless of
      //                                 which trigger was used)
      //   #word          -> tag
      //   [[partial      -> link       (bracket form, handles spaces)
      //   [partial       -> attr-key   (no ':' yet: suggest attribute names)
      //   [key:partial   -> attr-value (suggest values for that attribute)
      let autoItems = [];
      let autoIndex = 0;
      let autoCtx = null;

      // Whitespace-bounded @/# token at the cursor (fallback when no
      // enclosing bracket is found by getEditContext).
      function getActiveToken(value, cursorPos) {
        let start = cursorPos;
        while (start > 0 && !/\s/.test(value[start - 1])) start--;
        let end = cursorPos;
        while (end < value.length && !/\s/.test(value[end])) end++;
        const token = value.slice(start, end);
        const sigil = token[0];
        if (sigil !== "@" && sigil !== "#") return null;
        return { kind: sigil === "@" ? "link" : "tag", start, end, query: token.slice(1) };
      }

      // Scans backward from the cursor for the nearest `[` or `]` -
      // deliberately NOT stopping at whitespace, since both [[link names]]
      // and [attr:values] can legitimately contain spaces. Landing on an
      // unclosed `[` (or `[[`) means the cursor is inside bracket syntax;
      // hitting `]` (or the start of the string) first means it isn't, and
      // falls back to the whitespace-bounded @/# token scan instead.
      function getEditContext(value, cursorPos) {
        let i = cursorPos - 1;
        while (i >= 0 && value[i] !== "[" && value[i] !== "]") {
          i--;
        }
        if (i >= 0 && value[i] === "[") {
          const bracketStart = i;
          const isDouble = bracketStart > 0 && value[bracketStart - 1] === "[";
          const openStart = isDouble ? bracketStart - 1 : bracketStart;
          const inner = value.slice(bracketStart + 1, cursorPos);

          if (isDouble) {
            const end =
              value.slice(cursorPos, cursorPos + 2) === "]]" ? cursorPos + 2 : cursorPos;
            return { kind: "link", start: openStart, end, query: inner };
          }

          const end = value[cursorPos] === "]" ? cursorPos + 1 : cursorPos;
          const colonIdx = inner.indexOf(":");
          if (colonIdx === -1) {
            return { kind: "attr-key", start: openStart, end, query: inner };
          }
          return {
            kind: "attr-value",
            start: openStart,
            end,
            key: inner.slice(0, colonIdx).trim(),
            query: inner.slice(colonIdx + 1),
          };
        }
        return getActiveToken(value, cursorPos);
      }

      function closeAutocomplete() {
        autoItems = [];
        autoCtx = null;
        const box = $("#autocomplete-list");
        clear(box);
        box.style.display = "none";
      }

      function labelFor(val) {
        if (autoCtx.kind === "link") return `[[${val}]]`;
        if (autoCtx.kind === "tag") return `#${val}`;
        if (autoCtx.kind === "attr-value") return `${autoCtx.key}:${val}`;
        return val; // attr-key
      }

      function renderAutocompleteList() {
        const box = $("#autocomplete-list");
        clear(box);
        autoItems.forEach((val, i) => {
          box.appendChild(
            el(
              "div",
              {
                class: "autocomplete-item" + (i === autoIndex ? " active" : ""),
                onmousedown: (e) => {
                  e.preventDefault(); // keep focus on the input, not the dropdown
                  autoIndex = i;
                  acceptAutoActive();
                },
              },
              labelFor(val),
            ),
          );
        });
        box.style.display = autoItems.length ? "block" : "none";
      }

      function moveAutoActive(delta) {
        if (!autoItems.length) return;
        autoIndex = (autoIndex + delta + autoItems.length) % autoItems.length;
        renderAutocompleteList();
      }

      function acceptAutoActive() {
        if (!autoItems.length || !autoCtx) return;
        const value = autoItems[autoIndex];
        const ctx = autoCtx;
        const input = $("#search");
        const before = input.value.slice(0, ctx.start);
        const after = input.value.slice(ctx.end);

        let inserted;
        let isComplete = true;
        if (ctx.kind === "link") inserted = `[[${value}]] `;
        else if (ctx.kind === "tag") inserted = `#${value} `;
        else if (ctx.kind === "attr-value") inserted = `[${ctx.key}:${value}] `;
        else {
          inserted = `[${value}:`; // attr-key: leave the bracket open for a value
          isComplete = false;
        }

        input.value = before + inserted + after;
        const cursor = (before + inserted).length;
        closeAutocomplete();
        input.focus();
        input.setSelectionRange(cursor, cursor);
        if (isComplete) runSearch();
        else updateAutocomplete(); // immediately offer value suggestions
      }

      async function updateAutocomplete() {
        const input = $("#search");
        const ctx = getEditContext(input.value, input.selectionStart);
        if (!ctx) {
          closeAutocomplete();
          return;
        }

        let source;
        if (ctx.kind === "tag") source = tagListCache;
        else if (ctx.kind === "link") source = linkListCache;
        else if (ctx.kind === "attr-key") source = attributeNameCache;
        else if (ctx.kind === "attr-value") {
          source = attributeValueCache[ctx.key];
          if (!source) {
            source = await fetchAttributeValues(ctx.key);
            // The user may have kept typing (or blurred) while this awaited.
            if (document.activeElement !== input) return;
          }
        }

        autoCtx = ctx;
        const q = ctx.query.toLowerCase();
        autoItems = (source || []).filter((v) => v.toLowerCase().startsWith(q)).slice(0, 8);
        autoIndex = 0;
        renderAutocompleteList();
      }

      // ---------- History (browser back/forward) ----------
      // Every top-level view (welcome/search/note/graph/localGraph) pushes
      // or replaces a history entry so Back/Forward move between them.
      // Repeated entries into the "same page" (e.g. live-typing a search,
      // or re-opening the already-open global graph) replace instead of
      // pushing, so Back doesn't have to click through every keystroke.
      let currentHistoryKey; // undefined until the first navigateTo() call
      let isReplayingHistory = false;

      function historyStateKey(state) {
        if (state.view === "note") return "note:" + state.filename;
        if (state.view === "localGraph") return "localGraph:" + state.centerId;
        return state.view;
      }

      function navigateTo(state) {
        const key = historyStateKey(state);
        if (isReplayingHistory) {
          currentHistoryKey = key;
          return;
        }
        const method =
          currentHistoryKey === undefined || currentHistoryKey === key
            ? "replaceState"
            : "pushState";
        history[method](state, "");
        currentHistoryKey = key;
      }

      function applyHistoryState(state) {
        if (!state || !state.view) {
          $("#search").value = "";
          renderWelcome();
          return;
        }
        switch (state.view) {
          case "note":
            openNote(state.filename, state.line);
            break;
          case "graph":
            $("#search").value = state.q || "";
            lastSearchFilenames = state.filenames ? new Set(state.filenames) : null;
            renderGraph();
            break;
          case "localGraph":
            $("#search").value = state.q || "";
            renderLocalGraph(state.centerId);
            break;
          case "search":
            $("#search").value = state.q || "";
            executeSearchNow(state.q || "");
            break;
          default:
            $("#search").value = "";
            renderWelcome();
        }
      }

      window.addEventListener("popstate", (e) => {
        isReplayingHistory = true;
        applyHistoryState(e.state);
        isReplayingHistory = false;
      });

      // ---------- Search ----------
      function runSearch() {
        clearTimeout(debounceTimer);
        const q = $("#search").value.trim();
        if (!q) {
          renderWelcome();
          return;
        }
        debounceTimer = setTimeout(() => executeSearchNow(q), 180);
      }

      // Filenames matched by the last search - null means "no active
      // search", in which case the graph view shows the whole vault.
      let lastSearchFilenames = null;

      async function executeSearchNow(q) {
        setStatus("Searching…", true);
        const content = $("#content");
        try {
          const res = await fetch(
            `/api/search?q=${encodeURIComponent(q)}`,
          ).then((r) => r.json());
          lastSearchFilenames = new Set([
            ...(res.notes || []).map((n) => n.filename),
            ...(res.todos || []).map((t) => t.filename),
          ]);
          renderResults(content, res);
          navigateTo({ view: "search", q });
        } catch (e) {
          renderError(content, "Search failed", e);
        } finally {
          setStatus("", false);
        }
      }

      function renderResults(content, res) {
        exitGraphMode(content);
        clear(content);
        const notes = res.notes || [];
        const todos = res.todos || [];

        if (notes.length === 0 && todos.length === 0) {
          content.appendChild(
            buildEmpty("🤷", "No results", "Try a different query"),
          );
          return;
        }

        const total = notes.length + todos.length;
        content.appendChild(
          el(
            "div",
            { class: "page-header" },
            el("div", { class: "page-title", text: "Results" }),
            el("div", {
              class: "page-meta",
              text: `${total} ${total === 1 ? "match" : "matches"}`,
            }),
          ),
        );

        if (notes.length) {
          content.appendChild(
            el("div", {
              class: "section-title",
              text: `Notes (${notes.length})`,
            }),
          );
          for (const n of notes) content.appendChild(noteCard(n));
        }
        if (todos.length) {
          content.appendChild(
            el("div", {
              class: "section-title",
              text: `Todos (${todos.length})`,
            }),
          );
          for (const t of todos) content.appendChild(todoCard(t));
        }
      }

      function formatCardDate(unixSeconds) {
        if (!unixSeconds) return null;
        return new Date(unixSeconds * 1000).toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      // Toggles an inline expansion of a note card's todo/link footer chip.
      // `kind` is "todos" or "links"; `items` is the list to render (todo
      // summaries or link name strings).
      function toggleCardExpand(card, kind, items) {
        const cls = "card-expand-" + kind;
        const existing = card.querySelector("." + cls);
        if (existing) {
          card.removeChild(existing);
          return;
        }

        const box = el("div", { class: "card-expand " + cls });
        if (!items.length) {
          box.appendChild(
            el("div", {
              class: "card-expand-empty",
              text: kind === "todos" ? "No todos" : "No links",
            }),
          );
        } else if (kind === "todos") {
          for (const t of items) {
            box.appendChild(
              el("div", {
                class: "card-expand-item",
                onclick: (e) => {
                  e.stopPropagation();
                  openNote(card.dataset.filename || "", t.line_number);
                },
                text: t.text,
              }),
            );
          }
        } else {
          for (const link of items) {
            box.appendChild(
              el("div", {
                class: "card-expand-item",
                onclick: (e) => {
                  e.stopPropagation();
                  openNote(link);
                },
                text: link,
              }),
            );
          }
        }
        card.appendChild(box);
      }

      function noteCard(n) {
        const open = () => openNote(n.filename || "");
        const date = formatCardDate(n.created);
        const card = el(
          "div",
          {
            class: "card",
            tabindex: "0",
            role: "button",
            dataset: { filename: n.filename || "" },
            onclick: open,
            onkeydown: keyActivate(open),
          },
          el("div", { class: "card-title", text: n.title || n.filename || "" }),
          date ? el("div", { class: "card-date", text: date }) : null,
          el("div", {
            class: "card-snippet",
            text: n.body_preview || "",
          }),
        );

        let links = [];
        try {
          links = JSON.parse(n.links || "[]");
        } catch {
          links = [];
        }
        const todos = n.todos || [];

        const meta = el(
          "div",
          { class: "card-meta" },
          el("span", { text: n.filename || "" }),
          el("span", {
            class: "chip clickable",
            text: `${n.todo_count} todos`,
            onclick: (e) => {
              e.stopPropagation();
              toggleCardExpand(card, "todos", todos);
            },
          }),
          el("span", {
            class: "chip clickable",
            text: `${n.link_count} links`,
            onclick: (e) => {
              e.stopPropagation();
              toggleCardExpand(card, "links", links);
            },
          }),
          el("span", {
            class: "chip clickable",
            style: "margin-left: auto",
            title: "View in graph",
            text: "🕸",
            onclick: (e) => {
              e.stopPropagation();
              renderLocalGraph(n.filename || "");
            },
          }),
        );
        card.appendChild(meta);
        return card;
      }

      function todoCard(t) {
        const open = () => openNote(t.filename || "", t.line_number);
        const card = el(
          "div",
          {
            class: "card",
            tabindex: "0",
            role: "button",
            onclick: open,
            onkeydown: keyActivate(open),
          },
          el("div", { class: "card-title", text: "[ ] " + (t.text || "") }),
        );
        const meta = el("div", { class: "card-meta" });
        meta.appendChild(
          document.createTextNode(`${t.filename || ""}:${t.line_number || 0} `),
        );
        if (t.priority) {
          meta.appendChild(
            el("span", { class: "chip todo-prio", text: "P " + t.priority }),
          );
        }
        if (t.due_date) {
          meta.appendChild(
            el("span", { class: "chip todo-due", text: "due " + t.due_date }),
          );
        }
        card.appendChild(meta);
        return card;
      }

      // ---------- Note view ----------
      async function openNote(filename, line) {
        setStatus("Loading…", true);
        const content = $("#content");
        try {
          const url = `/api/note?filename=${encodeURIComponent(filename)}${line ? "&line=" + line : ""}`;
          const res = await fetch(url).then((r) => r.json());
          renderNote(content, res, line);
          navigateTo({ view: "note", filename, line });
        } catch (e) {
          renderError(content, "Could not load note", e);
        } finally {
          setStatus("", false);
        }
      }

      // Builds the note header/body/backlinks DOM for `res` as a detached
      // fragment, so both the full-page note view and the graph view's
      // inline preview panel can mount the same content.
      function buildNoteContentDOM(res, opts = {}) {
        const wrap = el("div");
        const bodyHTML = safeHTML(marked.parse(res.content || ""));

        const header = el(
          "div",
          { class: "note-header" },
          el("div", { class: "note-title", text: res.title || "Untitled" }),
          el("div", { class: "note-filename", text: res.filename || "" }),
        );
        if (!opts.compact) {
          header.appendChild(
            el("button", {
              class: "filter-tab",
              style: "margin-top: 8px",
              onclick: () => renderLocalGraph(res.filename || ""),
              text: "🕸 View in Graph",
            }),
          );
        } else {
          header.appendChild(
            el("a", {
              href: "#",
              style: "font-size: 12px; margin-top: 6px; display: inline-block",
              onclick: (e) => {
                e.preventDefault();
                openNote(res.filename || "");
              },
              text: "↗ Open full note",
            }),
          );
        }
        const chips = buildChips(res.header_fields);
        if (chips) header.appendChild(chips);
        wrap.appendChild(header);

        const body = el("div", { class: "body" });
        // safe: bodyHTML is DOMPurify-sanitized; build DOM via Range to
        // avoid ever assigning to a live node's innerHTML
        const frag = document.createRange().createContextualFragment(bodyHTML);
        body.appendChild(frag);
        wrap.appendChild(body);

        const backlinks = res.backlinks || [];
        if (backlinks.length) {
          wrap.appendChild(
            el("div", {
              class: "section-title",
              text: `Backlinks (${backlinks.length})`,
            }),
          );
          for (const b of backlinks) {
            const open = (e) => {
              e.preventDefault();
              openNote(b || "");
            };
            wrap.appendChild(
              el("div", {
                class: "backlink-card",
                dataset: { filename: b || "" },
                tabindex: "0",
                role: "button",
                onclick: open,
                onkeydown: keyActivate(open),
                text: "↩ " + (b || ""),
              }),
            );
          }
        }

        if (opts.highlightLine) {
          const line = opts.highlightLine;
          requestAnimationFrame(() => {
            const lineEl = wrap.querySelector(`.body [data-source-line="${line}"]`);
            if (lineEl && lineEl.style) {
              lineEl.style.background = "rgba(245, 158, 11, 0.18)";
              lineEl.style.borderRadius = "4px";
              if (lineEl.scrollIntoView)
                lineEl.scrollIntoView({ block: "center" });
            }
          });
        }

        return wrap;
      }

      function renderNote(content, res, highlightLine) {
        exitGraphMode(content);
        clear(content);
        content.appendChild(buildNoteContentDOM(res, { highlightLine }));
      }

      function buildChips(json) {
        if (!json) return null;
        try {
          const map = JSON.parse(json);
          const wrap = el("div", { class: "chips" });
          for (const [k, v] of Object.entries(map)) {
            const val = typeof v === "string" ? v : JSON.stringify(v);
            wrap.appendChild(
              el("span", { class: "chip", text: `${k}: ${val}` }),
            );
          }
          return wrap;
        } catch {
          return null;
        }
      }

      // ---------- Graph view ----------
      function exitGraphMode(content) {
        content.classList.remove("graph-mode");
        $("#graph-toggle").classList.remove("active");
      }

      const GRAPH_KIND_COLORS = {
        person: "#10b981",
        project: "#4f46e5",
        company: "#f59e0b",
        department: "#f59e0b",
      };
      function colorForKind(kind) {
        return GRAPH_KIND_COLORS[kind] || "#94a3b8";
      }

      // Full graph is fetched once and cached; both the global graph view
      // and every local (per-note) graph view work from this same copy -
      // expanding a local view just reveals more of it, no extra fetch.
      let graphDataCache = null;
      async function fetchGraphData() {
        if (!graphDataCache) {
          graphDataCache = await fetch("/api/graph").then((r) => r.json());
        }
        return graphDataCache;
      }

      function neighborsOf(edges, id) {
        const out = new Set();
        for (const e of edges) {
          if (e.source === id) out.add(e.target);
          else if (e.target === id) out.add(e.source);
        }
        return out;
      }

      async function renderGraph() {
        setStatus("Loading graph…", true);
        const content = $("#content");
        content.classList.add("graph-mode");
        $("#graph-toggle").classList.add("active");
        clear(content);
        try {
          const data = await fetchGraphData();
          // Shift+Click hides a node from this view only (in-memory, not
          // persisted) - resets whenever the graph view is re-opened.
          // Seeded with everything NOT in the last search's results, so the
          // graph opens scoped to that search rather than the whole vault;
          // Shift+Click/Alt+Click still work normally from there. A null
          // `lastSearchFilenames` (no active search) shows everything.
          const hidden = new Set();
          if (lastSearchFilenames) {
            for (const n of data.nodes) {
              if (!lastSearchFilenames.has(n.id)) hidden.add(n.id);
            }
          }
          const draw = () => {
            const nodes = data.nodes.filter((n) => !hidden.has(n.id));
            const edges = data.edges.filter(
              (e) => !hidden.has(e.source) && !hidden.has(e.target),
            );
            clear(content);
            drawForceGraph(content, nodes, edges, {
              ...(lastSearchFilenames
                ? {
                    emptyTitle: "No matches to graph",
                    emptyHint: "Try a different search, or clear it to see everything",
                  }
                : {}),
              onNodeClick: (d) => openNote(d.id),
              onNodeExpand: (d) => renderLocalGraph(d.id),
              onNodeRemove: (d) => {
                hidden.add(d.id);
                draw();
              },
            });
          };
          draw();
          navigateTo({
            view: "graph",
            q: $("#search").value,
            filenames: lastSearchFilenames ? [...lastSearchFilenames] : null,
          });
        } catch (e) {
          renderError(content, "Could not load graph", e);
        } finally {
          setStatus("", false);
        }
      }

      // Loads a note's content into the graph view's preview pane (below
      // the graph), without leaving graph mode.
      async function selectNodeInLocalGraph(previewPane, filename) {
        clear(previewPane);
        previewPane.appendChild(
          el("div", { class: "page-meta", text: "Loading…" }),
        );
        try {
          const url = `/api/note?filename=${encodeURIComponent(filename)}`;
          const res = await fetch(url).then((r) => r.json());
          clear(previewPane);
          previewPane.appendChild(buildNoteContentDOM(res, { compact: true }));
        } catch (e) {
          clear(previewPane);
          previewPane.appendChild(buildEmpty("⚠️", "Could not load note", String(e)));
        }
      }

      // Drag-resizes the split between the graph pane and the note preview
      // pane below it. Height is tracked in px (not %) once dragged, so it
      // stays put across window resizes, and persisted to localStorage so
      // the split survives reopening the graph view.
      function startGraphResize(e, splitEl, previewPane, resizer) {
        e.preventDefault();
        const startY = e.clientY;
        const startHeight = previewPane.getBoundingClientRect().height;
        resizer.classList.add("dragging");
        document.body.style.cursor = "row-resize";
        document.body.style.userSelect = "none";

        const onMove = (ev) => {
          const containerHeight = splitEl.getBoundingClientRect().height;
          const delta = startY - ev.clientY; // dragging up grows the preview pane
          const minHeight = 80;
          const maxHeight = containerHeight - 100; // leave room for the graph itself
          const newHeight = Math.max(
            minHeight,
            Math.min(maxHeight, startHeight + delta),
          );
          previewPane.style.flex = `0 0 ${newHeight}px`;
        };
        const onUp = () => {
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          resizer.classList.remove("dragging");
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
          localStorage.setItem(
            "ns-graph-preview-height",
            String(previewPane.getBoundingClientRect().height),
          );
        };
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      }

      // Local (ego-network) graph view for a single note: starts showing
      // just that note plus its direct neighbors, graph on top and the
      // selected note's content in a preview pane below. Single-click a
      // node to select it (shown in the preview); double-click a node to
      // expand the graph to include *its* neighbors too.
      async function renderLocalGraph(centerId) {
        if (!centerId) return;
        setStatus("Loading graph…", true);
        const content = $("#content");
        content.classList.add("graph-mode");
        $("#graph-toggle").classList.remove("active"); // this isn't the global graph view
        clear(content);

        const graphPane = el("div", { class: "graph-pane" });
        const previewPane = el("div", { class: "graph-preview-pane" });
        const resizer = el("div", {
          class: "graph-resizer",
          onmousedown: (e) => startGraphResize(e, splitEl, previewPane, resizer),
        });
        const splitEl = el(
          "div",
          { class: "graph-split" },
          graphPane,
          resizer,
          previewPane,
        );
        content.appendChild(splitEl);

        const savedHeight = localStorage.getItem("ns-graph-preview-height");
        if (savedHeight) previewPane.style.flex = `0 0 ${savedHeight}px`;

        try {
          const data = await fetchGraphData();
          const nodesById = new Map(data.nodes.map((n) => [n.id, n]));
          if (!nodesById.has(centerId)) {
            renderError(graphPane, "Note not found in graph", centerId);
            return;
          }

          const visible = new Set([centerId]);
          for (const n of neighborsOf(data.edges, centerId)) visible.add(n);
          let selectedId = centerId;
          let graphHandle = null;

          const draw = () => {
            const nodes = [...visible]
              .map((id) => nodesById.get(id))
              .filter(Boolean);
            const edges = data.edges.filter(
              (e) => visible.has(e.source) && visible.has(e.target),
            );
            clear(graphPane);
            graphHandle = drawForceGraph(graphPane, nodes, edges, {
              centerId,
              selectedId,
              onNodeClick: (d) => {
                selectedId = d.id;
                selectNodeInLocalGraph(previewPane, d.id);
                // Selection-only change: update the ring in place instead
                // of rebuilding the whole simulation/zoom/pan.
                if (graphHandle) graphHandle.updateSelection(selectedId);
              },
              onNodeExpand: (d) => {
                let added = false;
                for (const n of neighborsOf(data.edges, d.id)) {
                  if (!visible.has(n)) {
                    visible.add(n);
                    added = true;
                  }
                }
                if (added) draw();
              },
              onNodeRemove: (d) => {
                if (d.id === centerId) return; // can't remove the ego-center
                visible.delete(d.id);
                if (selectedId === d.id) {
                  selectedId = centerId;
                  selectNodeInLocalGraph(previewPane, centerId);
                }
                draw();
              },
            });
          };
          draw();
          selectNodeInLocalGraph(previewPane, centerId);
          navigateTo({ view: "localGraph", centerId, q: $("#search").value });
        } catch (e) {
          renderError(graphPane, "Could not load graph", e);
        } finally {
          setStatus("", false);
        }
      }

      /**
       * Shared force-directed graph renderer used by both the global graph
       * view and per-note local graph views.
       * opts:
       *   centerId       - if set, that node is pinned at the canvas center
       *                     and drawn with a highlight ring (ego-network mode).
       *   selectedId     - if set, that node is drawn with a selection ring
       *                     (takes visual priority over centerId).
       *   onNodeClick    - (node) => void, called on a plain click.
       *   onNodeExpand   - (node) => void, called on Alt+Click (optional).
       *                     Dblclick was dropped: the browser fires two
       *                     click events before dblclick, so onNodeClick
       *                     always fired first anyway - Alt+Click is a
       *                     single unambiguous event.
       *   onNodeRemove   - (node) => void, called on Shift+Click (optional).
       *                     Hides the node from this view only.
       *   emptyTitle,
       *   emptyHint      - override the "no nodes" empty-state copy
       *                     (defaults to "No notes to graph"/"Import some
       *                     notes first").
       */
      function drawForceGraph(container, nodesIn, edgesIn, opts = {}) {
        const width = container.clientWidth || 800;
        const height = container.clientHeight || 600;

        if (!nodesIn || nodesIn.length === 0) {
          container.appendChild(
            buildEmpty(
              "🕸",
              opts.emptyTitle || "No notes to graph",
              opts.emptyHint || "Import some notes first",
            ),
          );
          return;
        }

        const degree = new Map();
        for (const e of edgesIn) {
          degree.set(e.source, (degree.get(e.source) || 0) + 1);
          degree.set(e.target, (degree.get(e.target) || 0) + 1);
        }
        const radiusFor = (id) => 5 + Math.min(degree.get(id) || 0, 10) * 1.5;

        const svg = d3
          .select(container)
          .append("svg")
          .attr("class", "graph-svg")
          .attr("viewBox", [0, 0, width, height]);

        const g = svg.append("g");

        svg.call(
          d3
            .zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => g.attr("transform", event.transform)),
        );

        // D3 mutates these in place (adds x/y/vx/vy, and resolves
        // source/target from ids to node objects) - use fresh copies so
        // repeated/expanded graph draws don't reuse stale simulation state.
        const nodes = nodesIn.map((n) => ({ ...n }));
        const edges = edgesIn.map((e) => ({ ...e }));

        if (opts.centerId) {
          const center = nodes.find((n) => n.id === opts.centerId);
          if (center) {
            center.fx = width / 2;
            center.fy = height / 2;
          }
        }

        const simulation = d3
          .forceSimulation(nodes)
          .force(
            "link",
            d3
              .forceLink(edges)
              .id((d) => d.id)
              .distance(70),
          )
          .force("charge", d3.forceManyBody().strength(-160))
          .force("center", d3.forceCenter(width / 2, height / 2))
          .force(
            "collide",
            d3.forceCollide().radius((d) => radiusFor(d.id) + 4),
          );

        const graphLinkColor = getComputedStyle(document.documentElement)
          .getPropertyValue("--ns-graph-link")
          .trim();
        const graphLabelColor = getComputedStyle(document.documentElement)
          .getPropertyValue("--ns-graph-label")
          .trim();

        const link = g
          .append("g")
          .attr("stroke", graphLinkColor)
          .attr("stroke-opacity", 0.6)
          .selectAll("line")
          .data(edges)
          .join("line")
          .attr("stroke-width", 1);

        const node = g
          .append("g")
          .selectAll("g")
          .data(nodes)
          .join("g")
          .style("cursor", "pointer")
          .call(
            d3
              .drag()
              .on("start", (event, d) => {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
              })
              .on("drag", (event, d) => {
                d.fx = event.x;
                d.fy = event.y;
              })
              .on("end", (event) => {
                if (!event.active) simulation.alphaTarget(0);
                // Dragged nodes stay pinned where dropped instead of
                // snapping back into the force-directed layout.
              }),
          )
          .on("click", (event, d) => {
            if (event.altKey) {
              opts.onNodeExpand && opts.onNodeExpand(d);
            } else if (event.shiftKey) {
              opts.onNodeRemove && opts.onNodeRemove(d);
            } else {
              opts.onNodeClick && opts.onNodeClick(d);
            }
          });

        const strokeFor = (d) => {
          if (d.id === opts.selectedId) return "#f59e0b"; // selection ring
          if (d.id === opts.centerId) return "#4f46e5"; // ego-center ring
          return "#fff";
        };
        node
          .append("circle")
          .attr("r", (d) => radiusFor(d.id))
          .attr("fill", (d) => colorForKind(d.kind))
          .attr("stroke", strokeFor)
          .attr(
            "stroke-width",
            (d) => (d.id === opts.selectedId || d.id === opts.centerId ? 3 : 1.5),
          );

        node
          .append("title")
          .text(
            (d) =>
              `${d.title}\n${d.id}` +
              (opts.onNodeExpand ? "\nAlt+Click to expand" : "") +
              (opts.onNodeRemove ? "\nShift+Click to remove" : ""),
          );

        node
          .append("text")
          .text((d) => d.title)
          .attr("x", (d) => radiusFor(d.id) + 4)
          .attr("y", 4)
          .attr("font-size", "10px")
          .attr("fill", graphLabelColor)
          .attr("pointer-events", "none");

        simulation.on("tick", () => {
          link
            .attr("x1", (d) => d.source.x)
            .attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x)
            .attr("y2", (d) => d.target.y);
          node.attr("transform", (d) => `translate(${d.x},${d.y})`);
        });

        // Lets a plain click update the selection ring in place - callers
        // use this instead of a full redraw so the simulation/zoom/pan
        // aren't reset just for picking a different node.
        return {
          updateSelection(selectedId) {
            opts.selectedId = selectedId;
            node
              .select("circle")
              .attr("stroke", strokeFor)
              .attr(
                "stroke-width",
                (d) => (d.id === selectedId || d.id === opts.centerId ? 3 : 1.5),
              );
          },
        };
      }

      // ---------- Empty / error / welcome ----------
      function buildEmpty(icon, title, hint) {
        return el(
          "div",
          { class: "empty" },
          el("div", { class: "empty-icon", text: icon }),
          el("div", { class: "empty-title", text: title }),
          el("div", { class: "empty-hint", text: hint }),
        );
      }
      function renderWelcome() {
        lastSearchFilenames = null;
        exitGraphMode($("#content"));
        clear($("#content")).appendChild(
          buildEmpty(
            "🔍",
            "Search your notes",
            "Try @orchard, #project, [[Some Note]], or any word",
          ),
        );
        navigateTo({ view: "welcome" });
      }
      function renderError(content, title, e) {
        exitGraphMode(content);
        clear(content).appendChild(
          el(
            "div",
            { class: "empty" },
            el("div", { class: "empty-icon", text: "⚠️" }),
            el("div", { class: "empty-title", text: title }),
            el("div", { class: "empty-hint", text: String(e) }),
          ),
        );
      }

      // ---------- Wire up ----------
      $("#search").addEventListener("input", () => {
        runSearch();
        updateAutocomplete();
      });
      $("#search").addEventListener("keydown", (e) => {
        if (autoItems.length) {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            moveAutoActive(1);
            return;
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            moveAutoActive(-1);
            return;
          }
          if (e.key === "Enter" || e.key === "Tab") {
            e.preventDefault();
            acceptAutoActive();
            return;
          }
          if (e.key === "Escape") {
            e.preventDefault();
            closeAutocomplete();
            return;
          }
        }
        // No suggestions to accept, but Tab should still never leave the
        // search box (e.g. jump focus to the Graph View button below it) -
        // that's surprising while typing a query, and Tab has no other job
        // here since there's nothing else in the sidebar worth tabbing to.
        if (e.key === "Tab") {
          e.preventDefault();
          return;
        }
        if (e.key === "Escape") {
          $("#search").value = "";
          renderWelcome();
        }
      });
      $("#search").addEventListener("blur", closeAutocomplete);
      $("#graph-toggle").addEventListener("click", renderGraph);

      renderWelcome();
      loadAutocompleteData();
    </script>
  </body>
</html>
